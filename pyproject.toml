[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.1.1"
description = "Score job postings against your resume, requirement by requirement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jobfit = "jobfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
